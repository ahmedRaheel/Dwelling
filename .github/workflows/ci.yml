name: validate
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: pip install -r backend/requirements-dev.txt
      - name: Start isolated CI PostgreSQL with pgvector
        run: |
          docker run -d --name proptech-ci-postgres \
            -e POSTGRES_PASSWORD=ci_admin_password \
            -e POSTGRES_DB=proptech \
            -p 127.0.0.1:5432:5432 pgvector/pgvector:pg16
          for attempt in $(seq 1 40); do
            if docker exec proptech-ci-postgres pg_isready -U postgres -d proptech -q; then break; fi
            sleep 2
          done
          docker exec proptech-ci-postgres psql -U postgres -d proptech \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE proptech_app LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
      - name: Run migrations and tests against isolated database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://proptech_app:ci_app_password@localhost:5432/proptech
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci_admin_password@localhost:5432/proptech
          JWT_SECRET: testing-only-an-adequately-long-secret-0123456789
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          python -m compileall -q app
          pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
