# Reuse an existing PostgreSQL/pgvector container and its existing database.
# This Compose project deliberately has NO postgres service and NO pgdata volume.
# Set POSTGRES_DOCKER_NETWORK to a Docker network attached to your PostgreSQL container.
name: proptech-app

services:
  db-prepare:
    image: postgres:16-alpine
    restart: 'no'
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-proptech}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set existing PostgreSQL admin password in .env}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?Set application role password in .env}
    volumes:
      - ./docker/bootstrap-existing-db.sh:/bootstrap/bootstrap-existing-db.sh:ro
    entrypoint: ['/bin/sh', '/bootstrap/bootstrap-existing-db.sh']
    networks:
      - existing_postgres

  migrate:
    build:
      context: ./backend
    command: ['alembic', 'upgrade', 'head']
    user: root
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Define in .env}
      DATABASE_URL: ${DATABASE_URL:?Define in .env}
      JWT_SECRET: ${JWT_SECRET:?Define in .env}
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    networks:
      - existing_postgres

  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI: ${INSTALL_AI:-false}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define in .env}
      JWT_SECRET: ${JWT_SECRET:?Define in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      MIN_TRAINING_SAMPLES: ${MIN_TRAINING_SAMPLES:-20}
      MEDIA_DIR: /srv/media
      MAX_PROPERTY_PHOTOS: ${MAX_PROPERTY_PHOTOS:-24}
      MAX_PHOTO_UPLOAD_MB: ${MAX_PHOTO_UPLOAD_MB:-12}
    volumes:
      - media:/srv/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - existing_postgres
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge
  existing_postgres:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK:?Set this to a Docker network already attached to your PostgreSQL container}

volumes:
  media: {}
